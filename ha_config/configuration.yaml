# ============================================================
# InfluxDB Integration Snippet for EcoNet Grant Aerona
# ============================================================
# Add this to your Home Assistant configuration.yaml.
# Optional: requires an InfluxDB 1.x server reachable from HA.
#
# Use the InfluxDB 1.x API, not Flux/2.x. See README Step 11.
#
# Configure connection settings via Settings > Devices & Services.
# This snippet contains only filtering/schema options, no credentials.
#
# Steps:
#   1. Install InfluxDB app from Settings > Apps > Install app
#   2. In Chronograf UI > InfluxDB Admin > Databases:
#      create database "econet_grant" (choose your retention policy)
#   3. In InfluxDB Admin > Users: create user "homeassistant"
#      with a password and READ/WRITE on econet_grant, not global admin
#      Create a separate Grafana user with READ only on this database.
#   4. Add the InfluxDB integration via the UI:
#      Settings > Devices & Services > Add Integration > InfluxDB
#      Enter: host=<INFLUXDB_HOST>, port=<INFLUXDB_PORT>,
#      database=econet_grant, username=homeassistant,
#      password=<your password>
#   5. Paste this snippet into your configuration.yaml
#      (filtering only -- no connection keys)
#   6. Restart Home Assistant
# ============================================================

influxdb:
  max_retries: 3
  measurement_attr: unit_of_measurement
  default_measurement: state
  # Numeric states: field value; text states: field state.
  # Measurement is the unit (°C, Hz, rpm), or state for unitless entities.
  # Tags: domain=sensor/number/select; entity_id is the object ID WITHOUT domain.
  # Adjust globs for renamed devices/entities; inspect Developer Tools > States.
  include:
    entity_globs:
      - sensor.grant_aerona_heat_pump_*
      - number.grant_aerona_heat_pump_*
      - select.grant_aerona_heat_pump_*
